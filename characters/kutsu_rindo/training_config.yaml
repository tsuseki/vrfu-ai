---
job: extension
config:
  name: "kutsu_rindo"
  process:
    - type: 'sd_trainer'
      training_folder: "F:\\vrfu-ai\\loras\\characters"
      device: cuda:0
      trigger_word: "kutsu rindo"

      network:
        type: "lora"
        linear: 32
        linear_alpha: 16

      save:
        dtype: float16
        save_every: 250
        max_step_saves_to_keep: 4
        push_to_hub: false

      datasets:
        - folder_path: "F:\\vrfu-ai\\characters\\kutsu_rindo\\training"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [ 512, 768, 1024 ]

      train:
        batch_size: 1
        steps: 2000
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: true
        gradient_checkpointing: true
        noise_scheduler: "ddpm"
        optimizer: "adamw8bit"
        lr: 1e-4
        ema_config:
          use_ema: true
          ema_decay: 0.99
        dtype: bf16

      model:
        name_or_path: "F:\\vrfu-ai\\checkpoints\\waiIllustriousSDXL_v170.safetensors"
        is_flux: false
        arch: sdxl

meta:
  name: "[name]"
  version: '1.0'
